<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14211a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plant Mgr">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="connect.css">
<script src="config.js"></script>
<script src="connect.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Plant Manager: phone-first; a sidebar layout takes over at 1024px. Same palette as the catalog. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e7ebe4; --line:#d3dbd0;
  --fg:#17211b; --muted:#5b685f; --leaf:#2c6e49; --leaf-soft:#dcebe1;
  --accent:#a8326a; --accent-fg:#ffffff; --hold:#9a6a12; --hold-soft:#f5e9cf; --nfs-soft:#e9ece8;
  --bad:#a12a2a; --bad-soft:#f8e1e1; --info:#245d8f; --info-soft:#dde9f4; --comp:#245d8f;
  --shadow:0 1px 2px rgba(23,33,27,.06),0 4px 14px rgba(23,33,27,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --sunk:#1f2923; --line:#2c3831;
  --fg:#e6ece6; --muted:#9aa89e; --leaf:#7cc79a; --leaf-soft:#1f3a2a;
  --accent:#e87aa9; --accent-fg:#22101a; --hold:#e2b45a; --hold-soft:#3a2f17; --nfs-soft:#232c26;
  --bad:#f19a9a; --bad-soft:#3a1d1d; --info:#8cbcf0; --info-soft:#1b2c3d; --comp:#8cbcf0; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --sunk:#1f2923; --line:#2c3831;
  --fg:#e6ece6; --muted:#9aa89e; --leaf:#7cc79a; --leaf-soft:#1f3a2a;
  --accent:#e87aa9; --accent-fg:#22101a; --hold:#e2b45a; --hold-soft:#3a2f17; --nfs-soft:#232c26;
  --bad:#f19a9a; --bad-soft:#3a1d1d; --info:#8cbcf0; --info-soft:#1b2c3d; --comp:#8cbcf0; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* Shell */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font:700 1.35rem/1.1 var(--f-display);margin:0;flex:1;min-width:0}
.top .sub{display:block;font:400 .76rem/1.2 var(--f-body);color:var(--muted);margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:14px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:1180px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs .brand{display:none}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 1px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.66rem;font-weight:700;position:relative;min-width:0}
nav.tabs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
nav.tabs .dot{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font:700 .64rem/17px var(--f-body);padding:0 4px}

/* Building blocks */
h2.sec{font:700 1.05rem/1.2 var(--f-display);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec:first-child{margin-top:4px}
h2.sec small{font:400 .8rem var(--f-body);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:12px 14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;text-align:left;cursor:pointer;display:block;width:100%}
.tile b{display:block;font:700 1.5rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.25}
.tile.warn b{color:var(--hold)} .tile.alert b{color:var(--accent)} .tile.bad b{color:var(--bad)}
div.tile{cursor:default}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:.76rem;font-weight:700;line-height:1.15;text-align:center}
.quick svg{width:22px;height:22px;color:var(--leaf)}
.chart{padding:14px 14px 10px}
.chart .cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:120px}
.chart .col{display:grid;align-items:end;height:100%;position:relative}
.chart .col i{display:block;background:var(--leaf);border-radius:4px 4px 0 0;min-height:2px}
.chart .col:last-child i{background:var(--accent)}
.chart .lbls{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:6px}
.chart .lbls span{font:500 .66rem var(--f-mono);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.chart .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:.85rem;color:var(--muted);gap:8px;flex-wrap:wrap}
.chart .head b{font:700 1.15rem var(--f-display);color:var(--fg)}
.chart .col:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:.72rem;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:2}
.pchart svg{display:block;width:100%;height:auto;overflow:visible}
.pchart .ax{stroke:var(--line);stroke-width:1}
.pchart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.pchart text{font:500 10px var(--f-mono);fill:var(--muted)}
.pchart .sale{fill:var(--leaf)} .pchart .comp{fill:none;stroke:var(--comp);stroke-width:2} .pchart .nobid{fill:none;stroke:var(--muted);stroke-width:1.5}
.pchart .avg{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.pchart .trend{stroke:var(--fg);stroke-width:2;opacity:.6;stroke-linecap:round}
.pchart .trendlbl{fill:var(--fg);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.row:hover{border-color:var(--muted)}
.row .t{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.row .m{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .r{display:grid;justify-items:end;gap:4px;text-align:right}
.row .amt{font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums}
.row.noicon{grid-template-columns:minmax(0,1fr) auto}
.row.static{cursor:default}
.row .late{color:var(--bad);font-weight:700}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sunk);display:block}
.ph{width:48px;height:48px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font:700 .78rem var(--f-mono)}
.sku{font:500 .78rem var(--f-mono);color:var(--muted);letter-spacing:.02em}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--nfs-soft);color:var(--muted)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)} .pill.warn{background:var(--hold-soft);color:var(--hold)}
.pill.alert{background:var(--accent);color:var(--accent-fg)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;color:var(--muted);font-size:.9rem}
.more{border:0;background:none;color:var(--accent);cursor:pointer;padding:8px 0;font-size:.88rem;font-weight:700}
.note{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.m{font-size:.82rem;color:var(--muted)}

.toolbar{display:grid;gap:10px;margin-bottom:12px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;white-space:nowrap;cursor:pointer}
.chip .ct{font:500 .74rem var(--f-mono);opacity:.65;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:12px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.subtabs .ct{font:500 .72rem var(--f-mono);margin-left:5px;color:var(--accent)}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:11px;padding:12px 16px;font-weight:700;text-decoration:none;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.leaf{background:var(--leaf);color:var(--surface)}
.btn.small{padding:8px 12px;font-size:.86rem;border-radius:9px}
.btn.tiny{padding:5px 9px;font-size:.78rem;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad-soft)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.todo{display:grid;gap:6px}
.todo .row{grid-template-columns:36px minmax(0,1fr) auto}
.todo .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--leaf)}
.todo .ic svg{width:20px;height:20px}
.todo .ic.alert{background:var(--accent);color:var(--accent-fg)} .todo .ic.warn{background:var(--hold-soft);color:var(--hold)} .todo .ic.bad{background:var(--bad-soft);color:var(--bad)}
.board{display:grid;gap:14px}
.board .lane h3{font:700 .9rem var(--f-display);margin:0 0 8px;display:flex;justify-content:space-between;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-top:2px solid var(--line)}
.scroll{overflow-x:auto}
.pos{color:var(--leaf)} .neg{color:var(--bad)}

/* Sheets (bottom sheet on phone, centred dialog on desktop) */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);overscroll-behavior:contain}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:700 1.3rem/1.15 var(--f-display);margin:0 0 4px}
.sheet .lead{margin:0 0 10px;color:var(--muted);font-size:.88rem}
.sheet .foot{display:grid;gap:8px;margin-top:16px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 4px}
.sheet .foot .err,.err{color:var(--bad);font-size:.88rem;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);font-size:16px;min-height:44px}
.f textarea,textarea.inp{min-height:76px;resize:vertical}
.f.check{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--fg)}
.f.check input{width:20px;height:20px;min-height:0;accent-color:var(--leaf)}
.f .hint{font-size:.76rem;color:var(--muted)}
.lines{display:grid;gap:8px;grid-column:1/-1}
.line{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 8px;align-items:end;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative}
.line .f input,.line .f select{background:var(--surface)}
.line .s6{grid-column:span 6} .line .s3{grid-column:span 3} .line .s2{grid-column:span 2} .line .s1{grid-column:span 1}
.line .pick6{grid-column:1/6}
.line .x{height:44px;border:0;background:none;color:var(--bad);cursor:pointer;font-size:1.4rem;grid-column:6}
.line .name{grid-column:span 6;font-weight:700;font-size:.9rem;color:var(--fg)}
.line .name small{font-weight:400;color:var(--muted)}
.lines .sum{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.lines .addline{justify-self:start}
.row.picking{grid-template-columns:28px minmax(0,1fr) auto}
.row.picking.on{border-color:var(--leaf);background:var(--leaf-soft)}
.tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--surface);font-size:.85rem}
.row.on .tick{background:var(--leaf);border-color:var(--leaf)}
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:7;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.selbar .ct{font-weight:700}
.selbar .ghost{justify-self:end}
main.selecting{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}
.kv{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{display:grid;grid-template-columns:8rem 1fr;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:.92rem}
.kv div:first-child{border-top:0}
.kv dt{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.hero{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.hero img,.hero .ph{width:72px;height:72px;border-radius:14px;object-fit:cover}
.statusrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.gallery a{position:relative;display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .v{position:absolute;right:4px;bottom:4px;background:rgba(10,14,12,.65);color:#fff;font-size:.62rem;font-weight:700;border-radius:4px;padding:1px 4px}
.files{display:grid;gap:8px;margin-top:10px}
.file{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;font-size:.86rem}
.file .pv{width:52px;height:52px;border-radius:8px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;font-size:.7rem;color:var(--muted);overflow:hidden}
.file .pv img,.file .pv video{width:100%;height:100%;object-fit:cover}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.prog.done i{background:var(--leaf)} .prog.fail i{background:var(--bad);width:100%}
.pick{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);font-size:.9rem;position:relative}
.pick b{color:var(--fg);font-size:1rem}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.contactlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.contactlinks a,.contactlinks span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.86rem;text-decoration:none;color:var(--fg);background:var(--bg)}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.92rem;overflow-wrap:anywhere}
.msg.mine{background:var(--leaf-soft);border-color:transparent}
.msg .who{display:block;font-size:.74rem;color:var(--muted);margin-bottom:4px}
.thread{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.thread h4{margin:0;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.lineage{display:grid;gap:6px;margin-top:6px}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.wx div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.8rem}
.wx b{display:block;font:700 1rem var(--f-display)}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.skel{height:76px;border-radius:14px;background:var(--sunk);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.two{display:grid;gap:0 24px}

@media (min-width:1024px){
  body{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  nav.tabs{position:sticky;top:0;height:100vh;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 14px;grid-row:1/3}
  nav.tabs .brand{display:block;font:700 1.3rem/1.1 var(--f-display);padding:0 10px 18px}
  nav.tabs .brand small{display:block;font:400 .78rem var(--f-body);color:var(--muted);margin-top:4px}
  nav.tabs button{grid-template-columns:24px 1fr;justify-items:start;align-items:center;gap:12px;padding:10px 12px;font-size:.95rem}

  .board.lanes .row .r{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}

  .selbar{left:232px;bottom:0;padding:12px 32px;grid-template-columns:1fr auto auto auto}

/* ===================== ERP layout ===================== */
:root{--side:#14211a;--side-fg:#c9d6cd;--side-mut:#8ea597;--side-act:#24392c;--radius:10px;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--sx:#9aa39c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side:#0a100c;--side-fg:#c9d6cd;--side-mut:#7d9286;--side-act:#1b2b21;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--sx:#5f6b63}}
:root[data-theme="dark"]{--side:#0a100c;--side-fg:#c9d6cd;--side-mut:#7d9286;--side-act:#1b2b21;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--sx:#5f6b63}
body{font-size:15px}
.top{gap:10px}
.top .ttl{flex:1;min-width:0}
.top .crumb{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;line-height:1.2}
.top h1{font-size:1.25rem}
.top .sub{display:none}
.sync{display:none;font-size:.78rem;color:var(--muted);white-space:nowrap}
.gsearch{display:none;position:relative;align-items:center;flex:1;max-width:460px}
.gsearch svg{position:absolute;left:11px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px 9px 34px;font-size:15px}
.gsearch.open{display:flex;position:absolute;left:12px;right:12px;top:calc(100% + 6px);max-width:none;z-index:9}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;z-index:10;max-height:70vh;overflow-y:auto}
.gres button{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;text-align:left;cursor:pointer;font-size:.9rem}
.gres button:hover,.gres button:focus{background:var(--sunk)}
.gres .k{font:700 .66rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.gres .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres .m{font:500 .76rem var(--f-mono);color:var(--muted)}
.gres .none{padding:12px;color:var(--muted);font-size:.9rem}
.card,.tile,.row,.panel{border-radius:var(--radius)}
.subtabs{background:transparent;border-radius:0;border-bottom:1px solid var(--line);padding:0;gap:2px;margin-bottom:14px}
.subtabs button{flex:0 0 auto;border-radius:0;padding:10px 12px 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-pressed="true"]{background:transparent;box-shadow:none;color:var(--leaf);border-bottom-color:var(--leaf)}
.chip{border-radius:7px;padding:5px 10px}
.btn{border-radius:8px}
nav.tabs .subnav{display:none}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);margin-bottom:14px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font:700 1rem/1.2 var(--f-display);margin:0;flex:1;min-width:140px}
.panel-h h2 small{display:block;font:400 .78rem var(--f-body);color:var(--muted);margin-top:2px}
.panel-b{padding:12px 14px}
.panel-b.flush{padding:0}

.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow > .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:76px}

.frow select,.frow input[type=date]{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);font-size:14px;min-height:36px}
.dash{display:grid;gap:14px}
.dash > *{min-width:0}
.dash .panel{margin-bottom:0}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--radius);padding:10px 12px;text-align:left;cursor:pointer;width:100%;display:grid;gap:3px}

.kpi small{font-size:.76rem;color:var(--muted)}
.kpi.alert{border-left-color:var(--accent)} .kpi.warn{border-left-color:var(--hold)} .kpi.bad{border-left-color:var(--bad)} .kpi.ok{border-left-color:var(--leaf)}
div.kpi{cursor:default}
.kpis.in{grid-template-columns:repeat(2,1fr);padding:12px 14px;border-bottom:1px solid var(--line)}
.kpis.in .kpi{border-left-width:1px;background:var(--bg)}

/* data tables */
.dt{min-width:0}
.dt-scroll{overflow-x:auto}
table.dtab{width:100%;border-collapse:collapse;font-size:.86rem}
table.dtab th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
table.dtab th button{all:unset;display:flex;gap:4px;align-items:center;padding:9px 10px;cursor:pointer;width:100%;box-sizing:border-box}
table.dtab th.n button{justify-content:flex-end}
table.dtab th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.dtab th .ar{opacity:.35;font-size:.8rem} table.dtab th[aria-sort] .ar{opacity:1;color:var(--leaf)}
table.dtab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.dtab td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.dtab td.mono{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
table.dtab td.wrap{white-space:normal;min-width:180px}
table.dtab tbody tr{cursor:pointer}
table.dtab tbody tr:hover{background:var(--sunk)}
table.dtab tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.dtab tbody tr.on{background:var(--leaf-soft)}
table.dtab .tick{width:20px;height:20px;border-radius:5px}
table.dtab tr.on .tick{background:var(--leaf);border-color:var(--leaf)}
table.dtab td.selc,table.dtab th.selc{width:34px;padding-right:0}
.dt-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.dt-sort{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);padding:0 0 8px}
.dt-sort select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);font-size:14px}
.dt-sort button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;cursor:pointer}
.dt-cards{display:grid;gap:6px}
.panel .dt-cards{padding:10px}
.dt-card{grid-template-columns:minmax(0,1fr) auto}
.dt-card .t{font-weight:700}
.dt-card.picking{grid-template-columns:28px minmax(0,1fr) auto}

/* charts */
.viz{position:relative}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz .ax{stroke:var(--line);stroke-width:1}
.viz .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.viz text{font:500 11px var(--f-mono);fill:var(--muted)}
.viz .col{fill:var(--leaf)}
.viz .col.hl,.viz .hit:hover + .col{fill:var(--accent)}
.viz .ln{fill:none;stroke:var(--s1);stroke-width:2}
.viz .ar{fill:var(--s1);opacity:.08}
.viz .dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.viz .hit{fill:transparent;cursor:crosshair}
.vtip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.76rem;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:3;transform:translate(-50%,-100%);margin-top:-8px}

}

function trackUrl(courier, n){
  n = String(n || '').replace(/\s/g,''); if(!n) return '';
  const c = low(courier);
  if(/ups/.test(c) || /^1Z/i.test(n)) return 'https:' + '//www.ups.com/track?tracknum=' + encodeURIComponent(n);
  if(/fedex/.test(c)) return 'https:' + '//www.fedex.com/fedextrack/?trknbr=' + encodeURIComponent(n);
  if(/usps/.test(c) || /^9\d{15,}$/.test(n)) return 'https:' + '//tools.usps.com/go/TrackConfirmAction?tLabels=' + encodeURIComponent(n);
  return 'https:' + '//www.google.com/search?q=' + encodeURIComponent(n);
}
/** The payment request message, built from your saved payment info. */
function payMessage(o){
  const s = S.data.settings, p = s.pay || {};
  const first = String(o._name || '').split(/\s+/)[0];
  const ways = [p.venmo && 'Venmo ' + p.venmo, p.paypal && 'PayPal ' + p.paypal, p.zelle && 'Zelle ' + p.zelle, p.cashapp && 'Cash App ' + p.cashapp, p.other].filter(Boolean);
  const items = o._lines.map(l => '• ' + l.item + (l.units > 1 ? ' × ' + l.units : '') + (l.price ? ' · ' + fmt$(l.price) : '')).join('\n');
  const ship = money(o.shipCharge);
  const dep = o._onHold && o._deposit ? [`Deposit received: −${fmt$(o._deposit)}`, `Balance due: ${fmt$(o._due)}`] : [];
  return [`Hi${first && first !== '(no' ? ' ' + first : ''}! Here's your total:`, items, ship ? '• Shipping · ' + fmt$(ship) : '', `Total: ${fmt$(o._total)}`, ...dep, '',
    ways.length ? 'You can pay with:\n' + ways.map(w => '• ' + w).join('\n') : '(Add your payment info under Money › Payment info.)',
    s.payNote || '', `Please put ${o.id} in the note. Thank you!`].filter(x => x !== '').join('\n');
}

    sumTxt.textContent = blank.length ? `${fmt$(left)} left, split over ${plural(units, 'unit')} (${fmt$(Math.round(left/(units||1)*100)/100)} each)` : (tot.value.trim() !== '' && Math.abs(t - fixed) > 0.005 ? `Line prices add up to ${fmt$(fixed)}` : '');
  }

    const name = cust.value.trim();
    if(!name){ err.textContent = 'Add the client’s name.'; err.hidden = false; cust.focus(); return; }
    const out = lines.map(r => ({sku: r.sku, kind: r.kind || (r.sku ? 'plant' : ''), item: r.name(), cultivar: r.cu.value.trim(), var: r.va.value.trim(),
      stage: r.sg.value, sub: r.sub, harvest: r.harvest, price: r.pr.value.trim(), units: Number(r.un.value) || 1})).filter(l => l.item);
    if(!out.length){ err.textContent = 'Add at least one item (a cultivar at least).'; err.hidden = false; return; }
    // fill blank prices from the items total, by quantity
    const blank = out.filter(l => l.price === ''), fixed = out.reduce((a, l) => a + (l.price === '' ? 0 : money(l.price)), 0);
    if(blank.length){
      const t = tot.value.trim() === '' ? fixed : money(tot.value);
      let units = blank.reduce((a, l) => a + l.units, 0), left = Math.round(Math.max(0, t - fixed) * 100);
      blank.forEach(l => { const share = Math.round(left * l.units / units); l.price = String(share / 100); left -= share; units -= l.units; });
    }
    const client = d.clients.find(c => low(c.name) === low(name));
    const payload = {customer:name, clientId: client ? client.id : '', status:status.value, payment:payment.value.trim(), type:type.value.trim(), platform:platform.value.trim(),
      lines: out, shipCharge: shipCharge.value.trim(), shipBy: shipBy.value, notes: notes.value.trim(), deposit: deposit.value.trim()};
    if(status.value === 'On hold' && !(money(deposit.value) > 0)){ err.textContent = 'Enter the deposit they paid to put the order on hold.'; err.hidden = false; deposit.focus(); return; }
    if(o) payload.id = o.id;
    err.hidden = true; save.disabled = true; save.textContent = 'Saving…';
    try{ const r = await api('saveOrder', payload); s.close(); toast(o ? 'Order saved' : `Created ${r.id}`); await load(); }
    catch(e){ err.textContent = e.message; err.hidden = false; save.disabled = false; save.textContent = o ? 'Save order' : 'Create order'; }
  };
}

async function pirateExport(ids){
  try{
    const r = await api('pirateShipCsv', ids);
    if(r.missing.length) toast(`${r.missing.length} order${r.missing.length===1?'':'s'} skipped: no address saved (${r.missing.slice(0,2).join(', ')})`, true);
    if(!r.count) return;
    const name = 'pirate-ship-' + iso(new Date()) + '.csv';
    if(!download(name, r.csv)){ await copyText(r.csv); toast('Download blocked here; the file was copied instead.'); }
    else if(!r.missing.length) toast(`Batch file for ${plural(r.count, 'order')} downloaded`);
  }catch(e){ toast(e.message, true); }
}
function reviewTracking(found, parent){
  if(parent && parent.close) parent.close();
  const d = S.data;
  const s = sheet('Match tracking numbers', found.length ? 'Check each match, change any that are wrong, then save.' : 'No tracking numbers found.');
  const open = d.orders.filter(o => o._active || o.status === 'Shipped');
  const rows = [];
  found.forEach(f => {
    const card = el('div','card pad'); card.style.marginTop = '8px';
    card.append(el('div','t', `${f.carrier || ''} ${f.tracking}`), el('div','m', [f.name, f.service, f.cost ? '$' + f.cost : '', f.date].filter(Boolean).join(' · ')));
    if(f.already){ card.append(el('p','note', 'Already on ' + f.orderId + '.')); s.body.append(card); return; }
    const x = el('select','inp'); x.style.marginTop = '6px';
    [['', 'Don’t save']].concat(open.map(o => [o.id, `${o.id} · ${o._name} · ${o.status}`])).forEach(([v, l]) => { const op = el('option', null, l); op.value = v; x.append(op); });
    x.value = f.orderId || '';
    card.append(x); s.body.append(card); rows.push({f, x});
  });
  const save = button('Save matched tracking','btn leaf', async () => {
    const m = rows.filter(r => r.x.value).map(r => ({orderId:r.x.value, tracking:r.f.tracking, carrier:r.f.carrier, service:r.f.service, cost:r.f.cost}));

    save.disabled = true; try{ await api('applyTracking', m); toast(`Saved ${plural(m.length, 'tracking number')}`); s.close(); await load(); }catch(e){ toast(e.message, true); save.disabled = false; }
  }, 'check');
  if(rows.length) s.foot.append(save);
  s.close = s.open();
}

/**
 * Sortable data table on desktop, compact cards on phones.
 * o = {id, cols:[{k,label,val,fmt?,cell?,num?,cls?,sort?}], rows, onOpen, card:{title,sub,right,pill}, sel:{kind,idOf}, empty, sort:{k,dir}, limit}
 */
function dataTable(o){
  const st = S.tbl[o.id] || (S.tbl[o.id] = {k: o.sort ? o.sort.k : null, dir: o.sort ? o.sort.dir : 1, limit: o.limit || 100});
  let rows = o.rows.slice();

  if(col){ const v = col.sort || col.val; rows.sort((a, b) => { let x = v(a), y = v(b); if(x instanceof Date) x = +x; if(y instanceof Date) y = +y; if(x == null || x === '') return 1; if(y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, {numeric:true})) * st.dir; }); }
  const wrap = el('div','dt');
  const selOn = !!(o.sel && S.sel && S.sel.kind === o.sel.kind);
  if(selOn) rows.forEach(x => S.sel.visible.push(o.sel.idOf(x)));
  if(!rows.length){ const e = el('div','empty', o.empty || 'Nothing here.'); e.style.margin = '12px'; wrap.append(e); return wrap; }
  const redraw = () => { const n = dataTable(o); wrap.replaceWith(n); };
  const open = x => { if(selOn){ const id = o.sel.idOf(x); if(S.sel.ids.has(id)) S.sel.ids.delete(id); else S.sel.ids.add(id); S.sel.redraw(); } else if(o.onOpen) o.onOpen(x); };
  const shown = rows.slice(0, st.limit);
  const show = (c, x) => { if(c.cell) return c.cell(x); const v = c.fmt ? c.fmt(x) : c.val(x); return document.createTextNode(v == null ? '' : v instanceof Date ? fmtDY(v) : String(v)); };
  if(DESK.matches){
    const sc = el('div','dt-scroll'); const t = el('table','dtab'); const thead = el('thead'); const hr = el('tr');
    if(selOn) hr.append(el('th','selc'));
    o.cols.forEach(c => {
      const th = el('th', c.num ? 'n' : null); const b = el('button'); b.type = 'button';
      b.append(document.createTextNode(c.label), el('span','ar', st.k === c.k ? (st.dir > 0 ? '▲' : '▼') : '↕'));
      if(st.k === c.k) th.setAttribute('aria-sort', st.dir > 0 ? 'ascending' : 'descending');
      b.onclick = () => { if(st.k === c.k) st.dir = -st.dir; else { st.k = c.k; st.dir = c.num ? -1 : 1; } redraw(); };
      th.append(b); hr.append(th);
    });
    thead.append(hr); t.append(thead);
    const tb = el('tbody');
    shown.forEach(x => {
      const tr = el('tr'); tr.tabIndex = 0;
      if(selOn){ const on = S.sel.ids.has(o.sel.idOf(x)); if(on) tr.classList.add('on'); const td = el('td','selc'); td.append(el('span','tick', on ? '✓' : '')); tr.append(td); tr.setAttribute('aria-selected', String(on)); }
      o.cols.forEach(c => { const td = el('td', [c.num ? 'n' : '', c.cls || ''].join(' ').trim() || null); td.append(show(c, x)); if(!c.cell){ td.title = td.textContent; } tr.append(td); });
      tr.onclick = () => open(x); tr.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(x); } };
      tb.append(tr);
    });
    t.append(tb); sc.append(t); wrap.append(sc);
  } else {
    // phone: sort picker + cards
    const sortable = o.cols.filter(c => !c.nosort);
    const sr = el('div','dt-sort'); const sel = el('select'); sel.setAttribute('aria-label','Sort by');
    sortable.forEach(c => { const op = el('option', null, 'Sort: ' + c.label); op.value = c.k; sel.append(op); });
    sel.value = st.k || ''; sel.onchange = () => { st.k = sel.value; const c = o.cols.find(x => x.k === st.k); st.dir = c && c.num ? -1 : 1; redraw(); };
    const dirb = el('button', null, st.dir > 0 ? '▲' : '▼'); dirb.type = 'button'; dirb.setAttribute('aria-label','Reverse order'); dirb.onclick = () => { st.dir = -st.dir; redraw(); };
    sr.append(sel, dirb); if(o.inPanel) sr.style.padding = '10px 10px 0'; wrap.append(sr);
    const list = el('div','list dt-cards');
    shown.forEach(x => {
      const b = el('button','row dt-card'); b.type = 'button';
      if(selOn){ const on = S.sel.ids.has(o.sel.idOf(x)); b.classList.add('picking'); if(on) b.classList.add('on'); b.append(el('span','tick', on ? '✓' : '')); b.setAttribute('aria-pressed', String(on)); }
      const mid = el('div'); mid.append(el('div','t', o.card.title(x)));
      const sub = o.card.sub(x); if(sub) mid.append(el('div','m', sub));
      const r = el('div','r'); const rv = o.card.right ? o.card.right(x) : ''; if(rv) r.append(el('span','amt', rv));
      const p = o.card.pill ? o.card.pill(x) : null; if(p) r.append(p);
      b.append(mid, r); b.onclick = () => open(x); list.append(b);
    });
    wrap.append(list);
  }
  const foot = el('div','dt-foot'); foot.append(el('span', null, `${rows.length} row${rows.length === 1 ? '' : 's'}${rows.length > shown.length ? ` · showing ${shown.length}` : ''}`));
  if(rows.length > shown.length){ const m = el('button','more', 'Show more'); m.type = 'button'; m.onclick = () => { st.limit += 200; redraw(); }; foot.append(m); }
  wrap.append(foot);
  return wrap;
}

/* ---------- charts (SVG, single axis, hover tooltips) ---------- */
function vtip(box){ let t = box.querySelector('.vtip'); if(!t){ t = el('div','vtip'); t.hidden = true; box.append(t); } return t; }
function tipAt(box, x, y, text){ const t = vtip(box); t.textContent = text; t.style.left = x + 'px'; t.style.top = y + 'px'; t.hidden = false; }
function hideTip(box){ const t = box.querySelector('.vtip'); if(t) t.hidden = true; }
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, text){ const e = document.createElementNS(NS, tag); Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v)); if(text != null) e.textContent = text; return e; }
function yScale(max){ const step = niceStep(Math.max(max, 1) / 4); return {step, top: Math.ceil(Math.max(max, 1) / step) * step}; }
/** points: [{label, value, tip}], kind 'col' | 'line' */
function timeChart(points, kind, fmtV, title){
  const box = el('div','viz'); if(title) box.append(el('p','vtitle', title));
  const narrow = !DESK.matches, W = narrow ? 360 : 600, H = narrow ? 190 : 200, L = 46, R = 10, T = 10, B = 24;
  const sv = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label': (title || '') + ': ' + points.map(p => p.label + ' ' + fmtV(p.value)).join(', ')});
  const {step, top} = yScale(Math.max(0, ...points.map(p => p.value)));
  const n = Math.max(points.length, 1), slot = (W - L - R) / n;
  const y = v => T + (1 - v / top) * (H - T - B), xc = i => L + slot * i + slot / 2;
  for(let v = 0; v <= top + 1e-9; v += step){ sv.append(svgEl('line', {x1:L, x2:W - R, y1:y(v), y2:y(v), class: v ? 'gl' : 'ax'})); sv.append(svgEl('text', {x:L - 6, y:y(v) + 3, 'text-anchor':'end'}, fmtV(v))); }
  const every = Math.ceil(n / (narrow ? 5 : 9));
  points.forEach((p, i) => { if(i % every === 0 || i === n - 1) sv.append(svgEl('text', {x:xc(i), y:H - 7, 'text-anchor':'middle'}, p.short || p.label)); });
  if(kind === 'col'){
    const bw = Math.max(2, Math.min(34, slot * 0.66));
    points.forEach((p, i) => {
      const h = Math.max(p.value ? 2 : 0, y(0) - y(p.value));
      const g = svgEl('g');
      const hit = svgEl('rect', {x:L + slot * i, y:T, width:slot, height:H - T - B, class:'hit'});
      const r = svgEl('path', {class:'col', d: h ? `M${xc(i) - bw/2},${y(0)} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z` : ''});
      g.append(hit, r); sv.append(g);
      const show = () => { r.classList.add('hl'); const bb = sv.getBoundingClientRect(); tipAt(box, (xc(i) / W) * bb.width, (y(p.value) / H) * bb.height + (title ? 22 : 0), p.tip || `${p.label}: ${fmtV(p.value)}`); };
      hit.addEventListener('pointerenter', show); hit.addEventListener('pointerleave', () => { r.classList.remove('hl'); hideTip(box); });
    });
  } else {
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${xc(i)},${y(p.value)}`).join(' ');
    sv.append(svgEl('path', {class:'ar', d: d + ` L${xc(n - 1)},${y(0)} L${xc(0)},${y(0)} Z`}));
    sv.append(svgEl('path', {class:'ln', d}));
    const dot = svgEl('circle', {class:'dot', r:5, cx:0, cy:0, visibility:'hidden'}); sv.append(dot);
    points.forEach((p, i) => {
      const hit = svgEl('rect', {x:L + slot * i, y:T, width:slot, height:H - T - B, class:'hit'}); sv.append(hit);
      hit.addEventListener('pointerenter', () => { dot.setAttribute('cx', xc(i)); dot.setAttribute('cy', y(p.value)); dot.setAttribute('visibility','visible'); const bb = sv.getBoundingClientRect(); tipAt(box, (xc(i) / W) * bb.width, (y(p.value) / H) * bb.height + (title ? 22 : 0), p.tip || `${p.label}: ${fmtV(p.value)}`); });
      hit.addEventListener('pointerleave', () => { dot.setAttribute('visibility','hidden'); hideTip(box); });
    });
    if(n) { const last = points[n - 1]; sv.append(svgEl('text', {x:xc(n - 1), y:y(last.value) - 9, 'text-anchor':'end', style:'fill:var(--fg);font-weight:700'}, fmtV(last.value))); }
  }
  box.append(sv);
  return box;
}
/** Horizontal bars, one series. items: [{label, value}] */
function hBars(items, fmtV, limit, onPick){
  const box = el('div','hbars');
  const max = Math.max(1, ...items.map(i => i.value));
  items.slice(0, limit || items.length).forEach(it => {
    const r = el(onPick ? 'button' : 'div','hbar'); if(onPick){ r.type = 'button'; r.style.cssText = 'border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%;color:inherit;font:inherit'; r.onclick = () => onPick(it); }
    r.title = `${it.label}: ${fmtV(it.value)}`;
    const b = el('div','b'); const i = el('i'); i.style.width = (it.value / max * 100).toFixed(1) + '%'; b.append(i);
    r.append(el('span','l', it.label), b, el('span','v', fmtV(it.value))); box.append(r);
  });

}
/** Donut with the top 7 + Other (fixed colour order; colour follows the entity). */
function donut(items, fmtV, centerLabel){
  const box = el('div','donut');
  const total = items.reduce((a, i) => a + i.value, 0);
  let parts = items.filter(i => i.value > 0);
  if(parts.length > 8){ const rest = parts.slice(7).reduce((a, i) => a + i.value, 0); parts = parts.slice(0, 7).concat([{label:`Other (${parts.length - 7})`, value:rest, other:true}]); }
  const sv = svgEl('svg', {viewBox:'0 0 200 200', role:'img', 'aria-label': parts.map(p => `${p.label} ${fmtV(p.value)}`).join(', ')});
  const R = 88, r = 54, cx = 100, cy = 100; let a0 = -Math.PI / 2;
  const pt = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  parts.forEach((p, i) => {
    const frac = total ? p.value / total : 0; if(!frac) return;
    const a1 = a0 + frac * Math.PI * 2 - (frac >= 1 ? 1e-4 : 0);
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, r), [x3, y3] = pt(a0, r);
    const s = svgEl('path', {class:'seg', d:`M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z`, style:`fill:var(${p.other ? '--sx' : '--s' + (i + 1)})`});
    s.append(svgEl('title', {}, `${p.label}: ${fmtV(p.value)} (${Math.round(frac * 100)}%)`));
    sv.append(s); a0 = a1;
  });
  sv.append(svgEl('text', {x:cx, y:cy + 2, 'text-anchor':'middle', class:'ctr1'}, fmtV(total)));
  sv.append(svgEl('text', {x:cx, y:cy + 18, 'text-anchor':'middle', class:'ctr2'}, centerLabel || 'total'));
  const lg = el('div','lgd');
  parts.forEach((p, i) => { const d = el('div'); const sw = el('i'); sw.style.background = `var(${p.other ? '--sx' : '--s' + (i + 1)})`; d.append(sw, el('span','l', p.label), el('span','v', `${fmtV(p.value)} · ${total ? Math.round(p.value / total * 100) : 0}%`)); lg.append(d); });
  box.append(sv, lg);
  return box;
}

function setupSearch(){
  const q = $('#gq'), res = $('#gres'), box = $('#gsearch');

    const d = S.data; const v = low(q.value); res.replaceChildren();
    if(!d || v.length < 2){ res.hidden = true; return; }
    const toks = v.split(/\s+/).filter(Boolean), hit = s => { s = low(s); return toks.every(t => s.includes(t)); };

    d.clients.forEach(c => { if(hit([c.name, c.instagram, c.facebook, c.email, c.city].join(' '))) out.push(['Client', c.name, c.status || '', () => clientSheet(c)]); });
    d.sales.forEach(s => { if(s.id && hit([s.id, s.item, s.customer].join(' '))) out.push(['Sale', s.item, s.id + ' · ' + fmt$(s._p), () => saleForm(s)]); });
    d.expenses.forEach(e => { if(hit([e.id, e.desc, e.vendor, e.order].join(' '))) out.push(['Expense', e.desc || e.vendor, e.id + ' · ' + fmt$(e._a), () => expenseForm(e)]); });

/* ---------- Period performance (the sheet's Sales Dashboard, reusable for sales and expenses) ---------- */
S.per = S.per || {};
try{ const v = JSON.parse(localStorage.getItem('pm.dash') || '{}'); Object.assign(S.per, v.per || {}); }catch(e){}
function perState(id, by){
  if(id === 'dash') return S.dash;
  return S.per[id] || (S.per[id] = {horizon:'30', group:'week', by, measure:'sales', from:'', to:'', f:{}, open:true});
}
function periodRange(D, dates){
  const t = today();
  const min = dates.length ? new Date(Math.min(...dates)) : t, max = dates.length ? new Date(Math.max(...dates)) : t;
  let start, end = new Date(Math.max(+t, +max));
  const back = n => { const x = new Date(t); x.setDate(x.getDate() - n); return x; };
  if(D.horizon === '7') start = back(6); else if(D.horizon === '30') start = back(29); else if(D.horizon === '90') start = back(89);
  else if(D.horizon === 'ytd') start = new Date(t.getFullYear(), 0, 1);
  else if(D.horizon === '12m'){ start = new Date(t); start.setMonth(start.getMonth() - 12); start.setDate(start.getDate() + 1); }
  else if(D.horizon === 'custom'){ start = parseD(D.from) || min; end = parseD(D.to) || end; }
  else start = new Date(min);
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return {start, end};
}
function bucketOf(dt, g){
  if(g === 'day') return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  if(g === 'week'){ const x = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  return new Date(dt.getFullYear(), dt.getMonth(), 1);
}
/**
 * cfg = {id, title, sub, rows, dateOf, valueOf, unitsOf, filters:[{k,label,keyOf}], breakdowns:[[k,label,keyOf]],
 *        measures:[[k,label]], kpis(rows,total,units) -> [[value,label]], verb ('Sales' | 'Spent'), empty, collapsible}
 */
function periodPanel(cfg){
  const D = perState(cfg.id, cfg.breakdowns[0][0]); D.f = D.f || {};
  if(!cfg.breakdowns.some(b => b[0] === D.by)) D.by = cfg.breakdowns[0][0];
  if(!cfg.measures.some(x => x[0] === D.measure)) D.measure = cfg.measures[0][0];
  const p = panel(cfg.title, cfg.sub); p.classList.add('c12');
  const redraw = () => { saveDash(); const n = periodPanel(cfg); p.replaceWith(n); };
  if(cfg.collapsible){
    const t = el('button','btn small ghost', D.open === false ? 'Show chart' : 'Hide chart'); t.type = 'button';
    t.setAttribute('aria-expanded', String(D.open !== false)); t.onclick = () => { D.open = D.open === false; redraw(); };
    p.head.append(t);
    if(D.open === false){ p.body.remove(); return p; }
  }
  p.body.remove();
  const fl = el('div','filters');
  fl.append(frow('Period', chipGroup(D, 'horizon', [['7','7 days'],['30','30 days'],['90','90 days'],['ytd','Year to date'],['12m','12 months'],['all','All time'],['custom','Custom']], redraw)));
  if(D.horizon === 'custom'){
    const r = el('div','frow'); r.append(el('span','lbl','From'));
    const a = el('input'); a.type = 'date'; a.value = D.from || ''; const b = el('input'); b.type = 'date'; b.value = D.to || '';
    a.onchange = () => { D.from = a.value; redraw(); }; b.onchange = () => { D.to = b.value; redraw(); };
    r.append(a, el('span','m','to'), b); fl.append(r);
  }
  fl.append(frow('Group by', chipGroup(D, 'group', [['day','Day'],['week','Week'],['month','Month']], redraw)));
  // dimension filters (genus, product…): only values that occur
  let rows = cfg.rows;
  (cfg.filters || []).forEach(fd => {
    const vals = [...new Set(cfg.rows.map(r => fd.keyOf(r) || '(Not set)'))].sort();
    if(!D.f[fd.k] || (D.f[fd.k] !== 'all' && !vals.includes(D.f[fd.k]))) D.f[fd.k] = 'all';
    fl.append(frow(fd.label, chipGroup(D.f, fd.k, [['all','All']].concat(vals.map(v => [v, v])), redraw)));

  });

  fl.append(r2);
  p.append(fl);

  const {start, end} = periodRange(D, cfg.rows.map(cfg.dateOf).filter(Boolean));
  const inP = rows.filter(r => { const d = cfg.dateOf(r); return d && d >= start && d <= end; });
  const total = inP.reduce((a, r) => a + cfg.valueOf(r), 0), units = inP.reduce((a, r) => a + (cfg.unitsOf ? cfg.unitsOf(r) : 1), 0);
  const k = el('div','kpis in');

  p.append(k);
  const filt = (cfg.filters || []).filter(fd => D.f[fd.k] !== 'all').map(fd => D.f[fd.k]);
  const sub = el('p','note', `${fmtDY(start)} – ${fmtDY(end)}${filt.length ? ' · ' + filt.join(' · ') : ''}`); sub.style.margin = '8px 14px 0'; p.append(sub);

  // periods, including empty ones so gaps show
  const map = new Map();
  for(let x = bucketOf(start, D.group); x <= end; ){ map.set(+x, 0); if(D.group === 'day') x = new Date(x.getFullYear(), x.getMonth(), x.getDate() + 1); else if(D.group === 'week') x = new Date(x.getFullYear(), x.getMonth(), x.getDate() + 7); else x = new Date(x.getFullYear(), x.getMonth() + 1, 1); if(map.size > 800) break; }
  inP.forEach(r => { const b = +bucketOf(cfg.dateOf(r), D.group); map.set(b, (map.get(b) || 0) + cfg.valueOf(r)); });
  const lab = (dt, short) => D.group === 'month' ? dt.toLocaleDateString(undefined, {month:'short', year: short ? '2-digit' : 'numeric'}) : (D.group === 'week' ? (short ? '' : 'Wk of ') : '') + dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  let run = 0;
  const pts = [...map.entries()].sort((a, b) => a[0] - b[0]).map(([ts, v]) => { const dt = new Date(ts); run += v; return {label: lab(dt), short: lab(dt, true), value: v, run}; });
  const money0 = v => '$' + Math.round(v).toLocaleString();
  const grid = el('div','dash'); grid.style.padding = '12px 14px 14px';
  const left = el('div','c7'); const right = el('div','c5');
  left.append(timeChart(pts, 'col', money0, `${cfg.verb} per ${D.group}`));
  const rt = timeChart(pts.map(q => ({label:q.label, short:q.short, value:q.run, tip:`${q.label}: ${money0(q.run)} so far`})), 'line', money0, 'Running total');
  rt.style.marginTop = '14px'; left.append(rt);
  // breakdown
  const keyOf = cfg.breakdowns.find(b => b[0] === D.by)[2];
  const g = {}; inP.forEach(r => { const kk = keyOf(r) || '(Not set)'; g[kk] = (g[kk] || 0) + (D.measure === 'units' ? (cfg.unitsOf ? cfg.unitsOf(r) : 1) : cfg.valueOf(r)); });
  const items = Object.entries(g).map(([label, value]) => ({label, value})).sort((a, b) => b.value - a.value);
  const mLabel = (cfg.measures.find(x => x[0] === D.measure) || cfg.measures[0])[1];
  const fv = D.measure === 'units' ? (v => String(Math.round(v))) : money0;
  const byLabel = bySel.options[bySel.selectedIndex].text;
  right.append(el('p','vtitle', `${cfg.verb} breakdown · ${byLabel}`));

  const tb = el('div'); tb.hidden = !D.table;
  const sum = items.reduce((a, i) => a + i.value, 0);
  const fill = () => { tb.replaceChildren(dataTable({id:cfg.id + '-brk', cols:[{k:'label', label:byLabel, val:x => x.label}, {k:'value', label:mLabel, val:x => x.value, num:true, fmt:x => fv(x.value)}, {k:'pct', label:'Share', val:x => x.value, num:true, fmt:x => (sum ? Math.round(x.value / sum * 100) : 0) + '%'}],
    rows:items, card:{title:x => x.label, sub:() => '', right:x => fv(x.value)}, sort:{k:'value', dir:-1}, inPanel:true, empty:'Nothing in this period.'})); };
  if(D.table) fill();
  ex.onclick = () => { D.table = !D.table; saveDash(); ex.setAttribute('aria-expanded', String(D.table)); ex.lastChild.textContent = D.table ? 'Hide breakdown table' : 'Show breakdown table'; tb.hidden = !D.table; if(D.table) fill(); };
  p.append(ex, tb);
  return p;
}

  const inGenus = all.filter(x => !P.genus || x.genus === P.genus);

  const pts = inGenus.filter(x => !P.product || x.product === P.product);

  card.append(form); m.append(card);
  const ranges = {d30:['30 days', 30], d90:['90 days', 90], y1:['1 year', 365], all:['All time', 0]};
  const chips = el('div','chips'); chips.style.margin = '10px 0';
  Object.entries(ranges).forEach(([k,[l]]) => { const b = el('button','chip', l); b.type='button'; b.setAttribute('aria-pressed', String(P.range===k)); b.onclick = () => { P.range = k; render(); }; chips.append(b); });
  m.append(chips);
  const t = today(), span = ranges[P.range][1];
  const list = pts.filter(f3).filter(x => !span || days(t, x.d) <= span).sort((a,b) => a.d - b.d);
  const sold = list.filter(x => x.kind === 'sale'), comps = list.filter(x => x.kind === 'comp'), nob = list.filter(x => x.kind === 'nobid');
  const prices = sold.map(x => x.p).sort((a,b)=>a-b);
  const avg = prices.length ? prices.reduce((a,b)=>a+b,0) / prices.length : 0;
  const med = prices.length ? (prices.length % 2 ? prices[(prices.length-1)/2] : (prices[prices.length/2-1] + prices[prices.length/2]) / 2) : 0;
  const name = [P.genus, P.product ? P.product.toLowerCase() + 's' : '', P.cultivar === '*' ? 'all cultivars' : P.cultivar, P.var, P.stage].filter(Boolean).join(' · ');

  m.append(el('p','note','Prices are per unit (multi-unit sales are divided). The trendline is a straight-line fit through your sale prices (and comps, when included); no-bid starting prices are left out. Genus comes from a Genus column on the sale if you add one, otherwise from the plant in INVENTORY. Product is Corm for corm stages and Plant otherwise, until a Product column is added.'));

/** Least-squares line through {d, p}. Needs 3+ prices spread over at least a week; the rate is per week under 2 months of data, per month after. */
function trendOf(list){
  const n = list.length; if(n < 3) return null;
  const xs = list.map(x => x.d.getTime() / 864e5), ys = list.map(x => x.p);
  const mx = xs.reduce((a,b)=>a+b,0) / n, my = ys.reduce((a,b)=>a+b,0) / n;
  let sxx = 0, sxy = 0; xs.forEach((x, i) => { sxx += (x - mx) * (x - mx); sxy += (x - mx) * (ys[i] - my); });
  const span = Math.max(...xs) - Math.min(...xs); if(span < 7 || !sxx) return null;
  const b = sxy / sxx, a = my - b * mx;   // price = a + b * day
  const unit = span < 60 ? 'week' : 'month';
  return {n, at: d => a + b * (d.getTime() / 864e5), rate: b * (unit === 'week' ? 7 : 30.44), unit, short: unit === 'week' ? 'wk' : 'mo'};
}
function priceChart(list, avg, name, trend){
  const narrow = window.innerWidth < 700;   // phone: a narrower drawing so labels stay readable
  const NS = 'http://www.w3.org/2000/svg', W = narrow ? 360 : 640, H = narrow ? 220 : 240, L = 42, R = 10, T = 12, B = 26;
  const wrap = el('div','card chart pchart');
  if(!list.length){ wrap.append(el('div','empty','No data points yet.')); return wrap; }
  const sv = document.createElementNS(NS, 'svg'); sv.setAttribute('viewBox', `0 0 ${W} ${H}`); sv.setAttribute('role','img');
  sv.setAttribute('aria-label', `${name}: ${list.length} price points from ${fmtDY(list[0].d)} to ${fmtDY(list[list.length-1].d)}${trend ? `, trending ${trend.rate >= 0 ? 'up' : 'down'} ${fmt$(Math.abs(Math.round(trend.rate)))} a ${trend.unit}` : ''}`);
  const mk = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v)); if(text != null) e.textContent = text; sv.append(e); return e; };
  let t0 = list[0].d.getTime(), t1 = list[list.length-1].d.getTime(); if(t1 - t0 < 864e5*7){ t0 -= 864e5*4; t1 += 864e5*4; }
  const maxP = Math.max(...list.map(x => x.p)) * 1.12, step = niceStep(maxP / 4);
  const top = Math.ceil(maxP / step) * step || 1;
  const x = d => L + (d.getTime() - t0) / (t1 - t0) * (W - L - R), y = p => T + (1 - p / top) * (H - T - B);
  for(let v = 0; v <= top + 0.001; v += step){ mk('line', {x1:L, x2:W-R, y1:y(v), y2:y(v), class: v ? 'gl' : 'ax'}); mk('text', {x:L-6, y:y(v)+3, 'text-anchor':'end'}, '$' + Math.round(v)); }
  const ticks = narrow ? 3 : 4; for(let i = 0; i <= ticks; i++){ const d = new Date(t0 + (t1 - t0) * i / ticks); mk('text', {x:x(d), y:H-8, 'text-anchor': i === 0 ? 'start' : i === ticks ? 'end' : 'middle'}, fmtD(d)); }
  if(avg) { mk('line', {x1:L, x2:W-R, y1:y(avg), y2:y(avg), class:'avg'}); mk('text', {x:L+4, y:y(avg)-5, 'text-anchor':'start'}, 'avg ' + fmt$(Math.round(avg))); }
  if(trend){
    const clamp = p => Math.max(0, Math.min(top, p)), d0 = new Date(t0), d1 = new Date(t1);
    mk('line', {x1:x(d0), x2:x(d1), y1:y(clamp(trend.at(d0))), y2:y(clamp(trend.at(d1))), class:'trend'});
    mk('text', {x:W-R, y:y(clamp(trend.at(d1))) - 7, 'text-anchor':'end', class:'trendlbl'}, `${trend.rate >= 0 ? '+' : '−'}${fmt$(Math.abs(Math.round(trend.rate)))}/${trend.short}`);
  }
  list.forEach(p => { const c = mk('circle', {cx:x(p.d), cy:y(p.p), r: p.kind === 'sale' ? 5 : 4.5, class: p.kind}); const tt = document.createElementNS(NS, 'title'); tt.textContent = `${fmtDY(p.d)} · ${fmt$(Math.round(p.p))} · ${p.kind === 'sale' ? 'sold' : p.kind === 'comp' ? 'comp' : 'no bid'}${p.cultivar ? ' · ' + [p.cultivar, p.var, p.stage].filter(Boolean).join(' ') : ''}${p.who ? ' · ' + p.who : ''}`; c.append(tt); });
  wrap.append(sv);
  const lg = el('div','legend'); const item = (cls, txt) => { const s = el('span'); const i = el('i'); if(cls==='sale') i.style.background = 'var(--leaf)'; else { i.style.border = '2px solid ' + (cls==='comp' ? 'var(--comp)' : 'var(--muted)'); } s.append(i, txt); lg.append(s); };
  item('sale','Your sales'); item('comp','Price-watch comps'); item('nobid','No bid (starting price)');
  const a = el('span'); const ai = el('i'); ai.style.cssText = 'width:16px;height:0;border-radius:0;border-top:2px dashed var(--accent)'; a.append(ai, 'Average of your sales'); lg.append(a);
  if(trend){ const tr = el('span'); const ti = el('i'); ti.style.cssText = 'width:16px;height:0;border-radius:0;border-top:2px solid var(--fg);opacity:.6'; tr.append(ti, 'Trendline'); lg.append(tr); }
  wrap.append(lg);
  return wrap;
}
function niceStep(v){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

/* ---------- Money ---------- */
function viewMoney(m){
  const tab = subtabs(m, 'mon', [['expenses','Expenses'],['reorder','Reorder'],['profit','Profit'],['taxes','Taxes'],['settings','Payment info']]);
  ({expenses:viewExpenses, reorder:viewReorder, profit:viewProfit, taxes:viewTaxes, settings:viewSettings})[tab](m);
}
function expenseRow(e){
  const b = el('button','row noicon'); b.type='button';
  const mid = el('div'); mid.append(el('div','t', e.desc || e.vendor || '(no description)'), el('div','m', [e.vendor && e.desc ? e.vendor : '', e._d ? fmtD(e._d) : e.date, e.category, e.paidWith, e.tracking ? '#' + e.tracking.slice(-6) : ''].filter(Boolean).join(' · ')));
  const r = el('div','r'); r.append(el('span','amt', fmt$(e._a)));
  const k = low(e.status || 'Ordered');
  r.append(el('span','pill ' + (k==='received' ? 'ok' : k==='shipped' ? 'info' : k==='cancelled' ? '' : 'warn'), e.status || 'Ordered'));
  if(!e.receipt && !/cancel/i.test(e.status)) r.append(el('span','pill bad','No receipt'));
  b.append(mid, r); b.onclick = () => expenseForm(e);
  return b;
}
function viewExpenses(m){
  const d = S.data, t = today(), y = t.getFullYear(), mo = t.getMonth();
  const live = d.expenses.filter(e => !/cancel/i.test(e.status));
  const month = live.filter(e => e._d && e._d.getFullYear()===y && e._d.getMonth()===mo).reduce((a,e)=>a+e._a,0);
  const ytd = live.filter(e => e._d && e._d.getFullYear()===y).reduce((a,e)=>a+e._a,0);
  const open = live.filter(e => e._open);
  const tiles = el('div','tiles');
  [[fmt$(month),'Spent this month'],[fmt$(ytd),'Spent this year'],[String(open.length),'On the way to you'],[String(live.filter(e => !e.receipt).length),'Missing receipts']]
    .forEach(([n,l]) => { const x = el('div','tile'); x.append(el('b',null,n), el('span',null,l)); tiles.append(x); });
  m.append(tiles);
  const perf = periodPanel(expensePerfCfg()); perf.style.marginTop = '14px'; m.append(perf);
  const tb = el('div','toolbar'); tb.style.marginTop = '14px';
  const search = el('input','search'); search.type = 'search'; search.placeholder = 'Find a charge: amount, vendor, statement name, card, order #, date'; search.value = S.expQ;
  const add = el('div','addbar'); add.append(button('Log expense','btn small', () => expenseForm(), 'plus'));
  const tabs = {open:['Not received', e => e._open && !/cancel/i.test(e.status)], received:['Received', e => /received/i.test(e.status)], noreceipt:['No receipt', e => !e.receipt && !/cancel/i.test(e.status)], all:['All', () => true]};
  tb.append(search, add, chipRow('expTab', tabs, d.expenses)); m.append(tb);
  const box = el('div'); m.append(box);
  const draw = () => {
    const q = low(S.expQ), qn = money(q);
    let list = d.expenses.filter(q ? () => true : tabs[S.expTab][1]);
    if(q) list = list.filter(e => [e.id, e.desc, e.vendor, e.stmt, e.paidWith, e.order, e.tracking, e.notes, e.category, e.date, e.platform].join(' ').toLowerCase().includes(q) || (qn && (Math.abs(e._a - qn) < 0.005 || Math.abs(money(e.amount) - qn) < 0.005)));
    list.sort((a,b)=>(b._d||0)-(a._d||0));
    box.replaceChildren();
    const pill = e => { const k = low(e.status || 'Ordered'); return pillOf(e.status || 'Ordered', k==='received' ? 'ok' : k==='shipped' ? 'info' : k==='cancelled' ? '' : 'warn'); };
    const cols = [
      {k:'id', label:'Expense', val:e => e.id, cls:'mono'},
      {k:'date', label:'Date', val:e => e._d, sort:e => e._d ? +e._d : 0, fmt:e => e._d ? fmtD(e._d) : e.date},
      {k:'vendor', label:'Vendor', val:e => e.vendor},
      {k:'desc', label:'What', val:e => e.desc, cls:'wrap'},
      {k:'category', label:'Category', val:e => e.category},
      {k:'paidWith', label:'Paid with', val:e => e.paidWith},
      {k:'status', label:'Status', val:e => e.status, cell:pill},
      {k:'receipt', label:'Receipt', val:e => e.receipt ? 1 : 0, cell:e => e.receipt ? pillOf('Yes','ok') : /cancel/i.test(e.status) ? document.createTextNode('') : pillOf('Missing','bad')},
      {k:'total', label:'Total', val:e => e._a, num:true, fmt:e => fmt$(e._a)},
    ];
    const p = panel(d.expenses.length ? `${plural(list.length, 'expense')} · ${fmt$(list.reduce((a,e)=>a+e._a,0))}` : 'Expenses'); p.body.classList.add('flush');
    p.body.append(dataTable({id:'expenses', cols, rows:list, onOpen:e => expenseForm(e), card:{title:e => e.desc || e.vendor || '(no description)', sub:e => [e.vendor && e.desc ? e.vendor : '', e._d ? fmtD(e._d) : e.date, e.category, e.paidWith].filter(Boolean).join(' · '), right:e => fmt$(e._a), pill}, sort:{k:'date', dir:-1}, inPanel:true,
      empty: d.expenses.length ? 'Nothing here.' : 'No expenses yet. Log plant purchases, supplies and shipping here, including tracking numbers for orders on the way.'}));
    box.append(p);
  };
  search.oninput = () => { S.expQ = search.value; draw(); };
  draw();
}

function viewReorder(m){
  const d = S.data;
  const add = el('div','addbar'); add.append(button('Add a supply','btn small', () => supplyForm(), 'plus')); m.append(add);
  m.append(el('p','note','Things you buy again and again. “Order again” opens the store page and starts the expense so you only fill in what changed.'));
  listOf(m, d.supplies, s => {
    const r = el('div','row noicon'); const mm = el('div');
    mm.append(el('div','t', s.item), el('div','m', [s.vendor, s.category, s.price ? 'last ' + fmt$(money(s.price)) : '', s.lastOrdered ? 'ordered ' + s.lastOrdered : ''].filter(Boolean).join(' · ')));
    const rr = el('div','r');
    rr.append(button('Order again','btn tiny', () => { if(s.link) window.open(s.link, '_blank', 'noopener'); expenseForm(null, {desc:s.item, vendor:s.vendor, category:s.category || 'Supplies', amount: money(s.price) || '', platform:s.vendor, supplyId:s.id}); }, ''), button('Edit','btn tiny ghost', () => supplyForm(s)));
    r.append(mm, rr); return r;
  }, 'No supplies saved yet.');
}
function supplyForm(s){
  const o = S.data.options;
  const f = form(s ? 'Edit supply' : 'Add a supply', [
    ['item','Item','text',{required:true, wide:true, placeholder:'e.g. 4" nursery pots (50 pack)'}],
    ['vendor','Store','list',{choices:['Amazon','Home Depot','Lowe’s','Walmart','Uline','Etsy']}],
    ['category','Category','select',{choices:o.expenseCategory}],
    ['link','Link to reorder','text',{wide:true, placeholder:'Paste the product page link'}],
    ['price','Usual price','money'],
    ['qty','Usual quantity','text'],
    ['notes','Notes','area'],
  ], s || {category:'Supplies', vendor:'Amazon'}, v => api('saveRecord','supplies', Object.assign({}, v, s ? {id:s.id} : {})), {done: () => 'Saved'});
  if(s) f.foot.append(button('Delete','btn danger', async () => { if(!confirm('Remove from the reorder list?')) return; try{ await api('deleteRecord','supplies', s.id); f.close(); await load(); }catch(e){ toast(e.message, true); } }));
}

function viewProfit(m){
  const d = S.data;
  m.append(el('p','note','Link a purchase to the plants it became with “For SKUs” on the expense (e.g. 0026, 0158). Its cost is split evenly across those SKUs. Revenue is your paid sales.'));
  const byCult = {};
  d.sales.filter(s => s._rev > 0).forEach(s => { const k = s.cultivar || '(no cultivar)'; const o = byCult[k] = byCult[k] || {rev:0, n:0, cost:0}; o.rev += s._rev; if(s._paid) o.n += s._u || 1; });
  Object.entries(d.cost).forEach(([sku, c]) => { const p = d.byPlant[sku] || d.byLot[sku]; const k = p ? (p.cultivar && d.byPlant[sku] ? p.cultivar : (p.common || p.cultivar || p.item)) : '(unknown SKU ' + sku + ')'; const o = byCult[k] = byCult[k] || {rev:0, n:0, cost:0}; o.cost += c; });
  const rows = Object.entries(byCult).sort((a,b) => b[1].rev - a[1].rev);
  const tot = rows.reduce((a,[,o]) => ({rev:a.rev+o.rev, cost:a.cost+o.cost, n:a.n+o.n}), {rev:0, cost:0, n:0});
  const tiles = el('div','tiles');
  [[fmt$(Math.round(tot.rev)),'Received (all time)'],[fmt$(Math.round(tot.cost)),'Linked costs'],[String(Object.keys(d.cost).length),'SKUs with a cost'],[fmt$(Math.round(d.expenses.filter(e => !/cancel/i.test(e.status) && !e._skus.length).reduce((a,e)=>a+e._a,0))),'Expenses not linked']]
    .forEach(([n,l]) => { const x = el('div','tile'); x.append(el('b',null,n), el('span',null,l)); tiles.append(x); });
  m.append(tiles);
  m.append(el('h2','sec','By cultivar'));
  const wrap = el('div','card scroll'); const tbl = el('table','tbl');
  const hr = el('tr'); ['Cultivar','Sold','Revenue','Linked cost','Profit'].forEach((h,i) => hr.append(el('th', i ? 'n' : null, h))); tbl.append(hr);
  rows.forEach(([k,o]) => { const tr = el('tr'); tr.append(el('td', null, k), el('td','n', String(o.n)), el('td','n', fmt$(Math.round(o.rev))), el('td','n', o.cost ? fmt$(Math.round(o.cost)) : '—'), el('td','n ' + (o.cost ? (o.rev - o.cost >= 0 ? 'pos' : 'neg') : ''), o.cost ? fmt$(Math.round(o.rev - o.cost)) : '—')); tbl.append(tr); });
  wrap.append(tbl); m.append(wrap);
  const skus = Object.keys(d.cost);
  if(skus.length){
    m.append(el('h2','sec','By SKU'));
    const w2 = el('div','card scroll'); const t2 = el('table','tbl');
    const h2 = el('tr'); ['SKU','Plant','Cost','Sold for','Profit'].forEach((h,i) => h2.append(el('th', i > 1 ? 'n' : null, h))); t2.append(h2);
    skus.sort().forEach(k => { const p = d.byPlant[k] || d.byLot[k]; const rev = d.sales.filter(s => s.sku === k).reduce((a,s)=>a+s._rev,0); const c = d.cost[k]; const tr = el('tr');
      tr.append(el('td', null, k), el('td', null, p ? (p.item || `${p.cultivar} ${p.var || ''}`) : '?'), el('td','n', fmt$(Math.round(c*100)/100)), el('td','n', rev ? fmt$(rev) : '—'), el('td','n ' + (rev ? (rev - c >= 0 ? 'pos' : 'neg') : ''), rev ? fmt$(Math.round((rev - c)*100)/100) : '—')); t2.append(tr); });
    w2.append(t2); m.append(w2);
  }
}

function viewTaxes(m){
  const d = S.data;
  const years = [...new Set(d.expenses.map(e => e._d && e._d.getFullYear()).concat(d.sales.map(s => s._d && s._d.getFullYear())).filter(Boolean).concat([new Date().getFullYear()]))].sort((a,b)=>b-a);
  const chips = el('div','chips'); years.forEach(y => { const b = el('button','chip', String(y)); b.type='button'; b.setAttribute('aria-pressed', String(S.taxYear===y)); b.onclick = () => { S.taxYear = y; render(); }; chips.append(b); }); m.append(chips);
  const Y = S.taxYear;
  const ex = d.expenses.filter(e => e._d && e._d.getFullYear() === Y && !/cancel/i.test(e.status));
  const sales = d.sales.filter(s => s._revD && s._revD.getFullYear() === Y && s._rev > 0);
  const gross = sales.reduce((a,s)=>a+s._rev,0), spent = ex.reduce((a,e)=>a+e._a,0);
  const tiles = el('div','tiles'); tiles.style.marginTop = '10px';
  [[fmt$(Math.round(gross)),'Paid sales'],[fmt$(Math.round(spent)),'Expenses'],[fmt$(Math.round(gross - spent)),'Sales minus expenses'],[String(ex.filter(e => !e.receipt).length),'Expenses without a receipt']]
    .forEach(([n,l], i) => { const x = el('div','tile' + (i===3 && n !== '0' ? ' warn' : '')); x.append(el('b',null,n), el('span',null,l)); tiles.append(x); });
  m.append(tiles);
  m.append(el('h2','sec','Expenses by Schedule C line'));
  const by = {}; ex.forEach(e => { by[e._tax] = (by[e._tax] || 0) + e._a; });
  const w = el('div','card scroll'); const tbl = el('table','tbl');
  const hr = el('tr'); hr.append(el('th', null, 'Line'), el('th','n','Amount')); tbl.append(hr);
  Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([k,v]) => { const tr = el('tr'); tr.append(el('td', null, k), el('td','n', fmt$(Math.round(v*100)/100))); tbl.append(tr); });
  const trt = el('tr','total'); trt.append(el('td', null, 'Total'), el('td','n', fmt$(Math.round(spent*100)/100))); tbl.append(trt);
  w.append(tbl); m.append(w);
  m.append(el('p','note','Lines are a starting point based on each category; confirm with your tax preparer before filing. I’m not a tax advisor.'));
  const exp = button(`Download ${Y} expenses (CSV)`,'btn small ghost', () => {
    const rows = [['Expense ID','Date','Vendor','What','Category','Schedule C line','Amount','Shipping','Total','Paid with','Statement name','Order #','Receipt','For SKUs','Notes']]
      .concat(ex.sort((a,b)=>a._d-b._d).map(e => [e.id, iso(e._d), e.vendor, e.desc, e.category, e._tax, money(e.amount), money(e.shipping), e._a, e.paidWith, e.stmt, e.order, e.receipt, e.forSkus, e.notes]));
    if(!download(`plant-expenses-${Y}.csv`, toCsv(rows))) copyText(toCsv(rows)).then(() => toast('Copied as CSV'));
  }, 'receipt');
  const exs = button(`Download ${Y} sales (CSV)`,'btn small ghost', () => {
    const rows = [['Sale ID','Date received','Item','Customer','Received','Payment type','Processor','Personal (F&F/Zelle/cash)','Platform','Order ID']]
      .concat(sales.sort((a,b)=>a._revD-b._revD).map(s => { const p = processor(s.payment); return [s.id, iso(s._revD), s.item + (s._deposit ? ' (deposit)' : ''), s.customer, s._rev, s.payment, p.kind, p.personal ? 'Yes' : 'No', s.platform, s.orderId]; }));
    if(!download(`plant-sales-${Y}.csv`, toCsv(rows))) copyText(toCsv(rows)).then(() => toast('Copied as CSV'));
  }, 'tag');
  const bar = el('div','addbar'); bar.append(exp, exs); m.append(bar);

  // 1099-K reconciliation
  m.append(el('h2','sec','1099-K check'));
  m.append(el('p','note','Payment apps send a 1099-K for goods & services payments. Enter what each form says; this compares it with what you logged. Friends & family, Zelle and cash payments aren’t on 1099-Ks but are still sales.'));
  const proc = {};
  sales.forEach(s => { const p = processor(s.payment); const o = proc[p.kind] = proc[p.kind] || {gs:0, ff:0}; if(p.personal) o.ff += s._rev; else o.gs += s._rev; });
  d.k1099.filter(k => String(k.year) === String(Y)).forEach(k => { proc[k.platform] = proc[k.platform] || {gs:0, ff:0}; });
  const w3 = el('div','card scroll'); const t3 = el('table','tbl');
  const h3 = el('tr'); ['Platform','Logged G&S','Logged F&F / personal','On 1099-K','Difference',''].forEach((h,i) => h3.append(el('th', i && i < 5 ? 'n' : null, h))); t3.append(h3);
  Object.entries(proc).sort((a,b) => (b[1].gs + b[1].ff) - (a[1].gs + a[1].ff)).forEach(([k,o]) => {
    const rec = d.k1099.find(x => String(x.year) === String(Y) && low(x.platform) === low(k));
    const g = rec ? money(rec.gross) : null;
    const tr = el('tr'); const diff = g === null ? null : g - o.gs;
    tr.append(el('td', null, k), el('td','n', fmt$(Math.round(o.gs))), el('td','n', o.ff ? fmt$(Math.round(o.ff)) : '—'), el('td','n', g === null ? '—' : fmt$(g)),
      el('td','n ' + (diff === null ? '' : Math.abs(diff) < 1 ? 'pos' : 'neg'), diff === null ? '' : Math.abs(diff) < 1 ? 'Matches' : fmt$(Math.round(diff))));
    const td = el('td'); td.append(button(rec ? 'Edit' : 'Enter', 'btn tiny ghost', () => k1099Form(Y, k, rec))); tr.append(td); t3.append(tr);
  });
  w3.append(t3); m.append(w3);
  const addk = button('Add a 1099-K','btn small ghost', () => k1099Form(Y), 'plus'); addk.style.marginTop = '8px'; m.append(addk);
  m.append(el('p','note','A positive difference means the 1099-K shows more than you logged: look for sales you haven’t recorded or payments marked F&F that came in as goods & services.'));
}
function k1099Form(year, platform, rec){
  form('1099-K', [
    ['year','Tax year','text',{required:true}],
    ['platform','Platform','list',{choices:['PayPal','Venmo','Square','Palmstreet','Cash App','eBay','Etsy'], required:true}],
    ['gross','Gross amount (box 1a)','money',{required:true}],
    ['notes','Notes','area'],
  ], rec ? {year:rec.year, platform:rec.platform, gross: money(rec.gross), notes:rec.notes} : {year:String(year), platform: platform || ''}, v => api('save1099k', v), {done: () => 'Saved'});
}
