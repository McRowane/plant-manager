/** Phones and computers connected to the installable app. */
function viewDevices(m){
  const d = S.data, list = (d.devices || []).slice().reverse();
  const inApp = !!window.PM_TRANSPORT;
  m.append(el('h2','sec','Phone and computer app'));
  m.append(el('p','note', d.appUrl
    ? 'The Plant Manager also works as an app you can add to your home screen. Connect each phone or computer once; disconnect it here any time.'
    : 'The installable Plant Manager app isn’t published yet. Once it is, connect your phone or computer here.'));
  const box = el('div','card pad'); m.append(box);
  const name = el('input','inp'); name.placeholder = 'Name it, e.g. iPhone or MacBook'; name.maxLength = 60;
  const go = button('Connect a device','btn small leaf', async () => {
    go.disabled = true;
    try{
      const r = await api('createDeviceKey', name.value.trim());
      await load();
      showConnect(r);
    }catch(e){ toast(e.message, true); go.disabled = false; }
  }, 'plus');
  const row = el('div','addbar'); row.style.marginTop = '8px'; row.append(go);
  box.append(name, row);
  if(!list.length) box.append(el('p','note','No devices connected yet.'));
  list.forEach(x => {
    const r = el('div','row static noicon'); r.style.marginTop = '8px';
    const mm = el('div'); mm.append(el('div','t', x.label || x.id), el('div','m', [x.id, 'connected ' + x.created, x.lastUsed ? 'last used ' + x.lastUsed : 'not used yet', x.revoked ? 'disconnected ' + x.revoked : ''].filter(Boolean).join(' · ')));
    const rr = el('div','r');
    if(x.revoked) rr.append(el('span','pill','Disconnected'));
    else rr.append(button('Disconnect','btn tiny danger', async () => {
      if(!confirm(`Disconnect ${x.label || x.id}? It stops working right away.${inApp ? ' If this is the device you’re using now, you’ll need a new connection link.' : ''}`)) return;
      try{ await api('revokeDevice', x.id); toast('Disconnected'); await load(); }catch(e){ toast(e.message, true); }
    }));
    r.append(mm, rr); box.append(r);
  });
}
function showConnect(r){
  const s = sheet('Connect ' + r.label, r.url ? 'Open this link on the phone or computer you want to connect. It works like a password: don’t share it.' : 'Copy this connection code into the app’s “Connect” screen. It works like a password: don’t share it.');
  if(r.url){
    const a = link('Open on this device', r.url, 'btn leaf'); a.style.width = '100%'; s.body.append(a);
  }
  const code = el('textarea','inp'); code.readOnly = true; code.rows = 3; code.value = r.url || r.key; code.style.marginTop = '10px'; s.body.append(code);
  s.body.append(button(r.url ? 'Copy link' : 'Copy code','btn small ghost', () => copyText(code.value).then(ok => toast(ok ? 'Copied' : 'Select it to copy')), 'copy'));
  s.body.append(el('p','note','On iPhone: open it in Safari, then tap Share › Add to Home Screen. If the home-screen app asks to connect, paste this same link or code.'));
  s.open();
}

/* ---------- sheets & forms ---------- */
function sheet(title, lead){
  const scrim = $('#scrim');
  const s = el('div','sheet'); s.setAttribute('role','dialog'); s.setAttribute('aria-modal','true');
  s.append(el('div','grab'));
  const h = el('h3', null, title); s.append(h);
  if(lead) s.append(el('p','lead', lead));
  const body = el('div'); s.append(body);
  const foot = el('div','foot');
  const prev = document.activeElement;
  const close = () => { scrim.hidden = true; scrim.replaceChildren(); document.removeEventListener('keydown', esc); if(prev && prev.focus && document.contains(prev)) prev.focus(); };
  const esc = e => { if(e.key === 'Escape') close(); };
  return {el:s, body, foot, title:h, open(){
    if(foot.children.length) s.append(foot);
    const x = el('button','btn ghost','Close'); x.type='button'; x.onclick = close;
    if(!foot.children.length){ x.style.marginTop = '16px'; x.style.width = '100%'; s.append(x); } else foot.append(x);
    scrim.replaceChildren(s); scrim.hidden = false;
    scrim.onclick = e => { if(e.target === scrim) close(); };
    document.addEventListener('keydown', esc);
    const first = s.querySelector('input:not([type=checkbox]):not([type=file]),select,textarea'); (first || x).focus({preventScroll:true});
    return close;
  }};
}

/** fields: [key, label, type, opts]; types: text, date, money, number, select, list (free text with suggestions), area, check.
 *  extra.inline: render into that element instead of a sheet. */
function form(title, fields, values, onSave, extra){
  extra = extra || {};
  const inline = extra.inline;
  const s = inline ? {body: el('div','card pad'), foot: el('div','foot')} : sheet(title, extra.lead);
  const f = el('form','form'); f.noValidate = true;
  const inputs = {};
  values = values || {};
  fields.forEach(([key, label, type, opts]) => {
    opts = opts || {};
    const w = el('label','f' + (opts.wide || type==='area' ? ' wide' : '') + (type==='check' ? ' check wide' : ''));
    let inp;
    if(type==='select'){ inp = el('select'); (opts.choices || []).forEach(c => { const o = el('option', null, c || '—'); o.value = c; inp.append(o); }); if(values[key] && !(opts.choices||[]).includes(values[key])){ const o = el('option', null, values[key]); o.value = values[key]; inp.append(o); } }
    else if(type==='area') inp = el('textarea');
    else { inp = el('input'); inp.type = type==='date' ? 'date' : type==='number' ? 'number' : type==='check' ? 'checkbox' : 'text'; if(type==='money'){ inp.inputMode = 'decimal'; inp.placeholder = '$0.00'; } if(type==='number') inp.inputMode = 'decimal'; }
    if(type==='list' && opts.choices){ const id = 'dl-' + key + '-' + Math.random().toString(36).slice(2,7); const dl = el('datalist'); dl.id = id; [...new Set(opts.choices)].forEach(c => { const o = el('option'); o.value = c; dl.append(o); }); inp.setAttribute('list', id); w.append(dl); }
    const v = values[key];
    if(type==='check') inp.checked = !!v;
    else if(type==='date') inp.value = v ? (iso(v instanceof Date ? v : parseD(v)) || '') : '';
    else if(type==='money') inp.value = v === undefined || v === null || v === '' ? '' : String(v).replace(/[$,]/g,'');
    else inp.value = v == null ? '' : v;
    if(opts.placeholder) inp.placeholder = opts.placeholder;
    if(opts.required) inp.required = true;
    inp.name = key; inputs[key] = inp;
    if(type==='check'){ w.append(inp, el('span', null, label)); } else { w.append(document.createTextNode(label + (opts.required ? ' *' : '')), inp); }
    if(opts.hint) w.append(el('span','hint', opts.hint));
    f.append(w);
  });
  s.body.append(f);
  const err = el('p','err'); err.hidden = true; err.setAttribute('role','alert');
  const save = el('button','btn', extra.saveLabel || 'Save'); save.type = 'button';
  s.foot.append(err, save);
  let close = () => {};
  if(inline){ s.body.append(s.foot); inline.append(s.body); } else close = s.open();
  const submit = async () => {
    const out = {};
    for(const [key, label, type, opts] of fields){
      const inp = inputs[key];
      out[key] = type==='check' ? inp.checked : inp.value.trim();
      if(opts && opts.required && !out[key]){ err.textContent = label + ' is needed.'; err.hidden = false; inp.focus(); return; }
    }
    err.hidden = true; save.disabled = true; save.textContent = 'Saving…';
    try{ const r = await onSave(out); if(!inline) close(); toast((extra.done && extra.done(r)) || 'Saved'); if(extra.after) await extra.after(r, out); await load(); }
    catch(e){ err.textContent = e.message || String(e); err.hidden = false; save.disabled = false; save.textContent = extra.saveLabel || 'Save'; }
  };
  save.onclick = submit;
  f.onsubmit = e => { e.preventDefault(); submit(); };
  return {inputs, close: () => close(), foot: s.foot, body: s.body};
}

/* ---------- photo & video upload ---------- */
function stamp(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function openUpload(sku){
  const p = sku && S.data.byPlant[sku];
  const s = sheet('Add photos & videos', 'They go into the plant’s album and show up in the customer catalog within about 30 minutes.');
  const fw = el('label','f wide'); fw.append('Plant');
  const pick = el('input'); pick.type = 'text'; pick.placeholder = 'Type a SKU or cultivar'; const dlid = 'dl-up'; pick.setAttribute('list', dlid);
  const dl = el('datalist'); dl.id = dlid; skuChoices().forEach(c => { const o = el('option'); o.value = c; dl.append(o); });
  if(p) pick.value = `${p.sku} · ${p.cultivar}${p.var ? ' ' + p.var : ''}`;
  fw.append(pick, dl);
  const box = el('label','pick'); box.style.marginTop = '12px';
  const inp = el('input'); inp.type = 'file'; inp.accept = 'image/*,video/*'; inp.multiple = true;
  box.append(icon('camera')); box.append(el('b', null, 'Take or choose photos & videos'), el('span', null, 'Pick as many as you like'), inp);
  const list = el('div','files');
  s.body.append(fw, box, list);
  let files = [];
  inp.onchange = () => {
    files = files.concat([...inp.files]); inp.value = '';
    list.replaceChildren();
    files.forEach(f => {
      const row = el('div','file'); const pv = el('div','pv');
      if(/^image\//.test(f.type)){ const im = el('img'); im.src = URL.createObjectURL(f); im.alt = ''; pv.append(im); } else pv.textContent = 'VIDEO';
      const info = el('div'); info.append(el('div', null, f.name), el('div','sku', (f.size/1048576).toFixed(1) + ' MB'));
      const prog = el('div','prog'); prog.append(el('i')); info.append(prog);
      row.append(pv, info); list.append(row); f._prog = prog;
    });
    gob.disabled = !files.length; gob.textContent = files.length ? `Upload ${files.length} file${files.length===1?'':'s'}` : 'Upload';
  };
  const err = el('p','err'); err.hidden = true;
  const gob = el('button','btn leaf','Upload'); gob.type = 'button'; gob.disabled = true;
  s.foot.append(err, gob);
  const close = s.open();
  gob.onclick = async () => {
    const k = skuOf(pick.value);
    if(!S.data.byPlant[k]){ err.textContent = 'Pick a plant from the list.'; err.hidden = false; pick.focus(); return; }
    err.hidden = true; gob.disabled = true; gob.textContent = 'Uploading…';
    try{
      const pass = await api('prepareUpload', k);
      const ids = [];
      for(const f of files){
        if(f._done){ ids.push(f._done); continue; }
        try{ f._done = await uploadOne(f, pass); ids.push(f._done); f._prog.classList.add('done'); f._prog.firstChild.style.width = '100%'; }
        catch(e){ f._prog.classList.add('fail'); throw e; }
      }
      gob.textContent = 'Finishing…';
      await api('finishUpload', k, ids);
      close(); toast(`${ids.length} file${ids.length===1?'':'s'} added to ${k}`); await load();
    }catch(e){ err.textContent = (e.message || String(e)) + ' You can try again; finished files won’t upload twice.'; err.hidden = false; gob.disabled = false; gob.textContent = 'Try again'; }
  };
}
function uploadOne(file, pass){
  return new Promise((resolve, reject) => {
    const when = file.lastModified ? new Date(file.lastModified) : new Date();
    const meta = {name: pass.prefix + stamp(when) + ' - ' + (file.name || 'upload'), parents: [pass.folderId], mimeType: file.type || 'application/octet-stream'};
    const b = 'pm' + Math.random().toString(36).slice(2);
    const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${meta.mimeType}\r\n\r\n`, file, `\r\n--${b}--`]);
    const x = new XMLHttpRequest();
    x.open('POST', 'https:' + '//www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id');
    x.setRequestHeader('Authorization', 'Bearer ' + pass.token);
    x.setRequestHeader('Content-Type', 'multipart/related; boundary=' + b);
    x.upload.onprogress = e => { if(e.lengthComputable && file._prog) file._prog.firstChild.style.width = (e.loaded/e.total*100).toFixed(0) + '%'; };
    x.onload = () => { if(x.status >= 200 && x.status < 300){ try{ resolve(JSON.parse(x.responseText).id); }catch(e){ reject(new Error('Upload finished but Drive sent an odd reply.')); } } else reject(new Error(`Upload of ${file.name} failed (${x.status}).`)); };
    x.onerror = () => reject(new Error(`Upload of ${file.name} failed. Check your connection.`));
    x.send(body);
  });
}

/* ---------- load ---------- */
function useData(d){
  d._at = Date.now();
  S.data = prep(d);
  try{ localStorage.setItem('pm.cache2', JSON.stringify(d)); }catch(e){}
  render();
}
async function load(force){
  if(S.fresh){ const d = S.fresh; S.fresh = null; useData(d); return; }   // a save already brought the new data
  if(S.loading){ S.again = true; return; }   // a save during a refresh: refresh again right after
  S.loading = true; S.again = false;
  const btn = $('#refresh'); btn.classList.add('spin');
  try{
    const d = await run('getData', force === true);
    if(S.fresh){ S.loading = false; btn.classList.remove('spin'); return load(); }   // a save finished meanwhile: its data is newer
    useData(d);
  }catch(e){
    toast('Couldn’t load: ' + (e.message || e), true);
    if(!S.data) $('#main').replaceChildren(el('div','empty','Couldn’t reach your sheet. Check your connection and tap refresh.'));
  }finally{ S.loading = false; btn.classList.remove('spin'); if(S.again) load(); }
}
$('#refresh').onclick = () => load(true);
try{ const c = JSON.parse(localStorage.getItem('pm.cache2') || 'null'); if(c && c.plants && c.orders){ S.data = prep(c); render(); } }catch(e){}
renderNav();
load();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.data && Date.now() - S.data._at > 120000) load(); });
})();
